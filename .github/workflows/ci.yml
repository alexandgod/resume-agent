name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 同一分支的新推送会取消旧的运行，避免排队浪费
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 测试与构建 (Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 核心单测（27 项）
        run: npm test

      - name: QA 独立回归（30 项）
        run: node --test server/tests/qa.regression.test.js

      - name: 生产构建
        run: npm run build
